<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <radialGradient id="engineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="engineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="300" fill="url(#engineBg)"/>

  <!-- Dynamic geometric rays -->
  <g fill="#1e293b" opacity="0.5">
    <path d="M600,150 L0,0 L150,0 Z"/>
    <path d="M600,150 L150,0 L350,0 Z" fill="#312e81"/>
    <path d="M600,150 L350,0 L600,0 Z"/>
    <path d="M600,150 L600,0 L850,0 Z" fill="#312e81"/>
    <path d="M600,150 L850,0 L1050,0 Z"/>
    <path d="M600,150 L1050,0 L1200,0 Z" fill="#312e81"/>

    <path d="M600,150 L0,300 L150,300 Z" fill="#312e81"/>
    <path d="M600,150 L150,300 L400,300 Z"/>
    <path d="M600,150 L400,300 L650,300 Z" fill="#312e81"/>
    <path d="M600,150 L650,300 L900,300 Z"/>
    <path d="M600,150 L900,300 L1200,300 Z" fill="#312e81"/>

    <path d="M600,150 L0,0 L0,150 Z"/>
    <path d="M600,150 L0,150 L0,300 Z" fill="#312e81"/>
    <path d="M600,150 L1200,0 L1200,150 Z" fill="#312e81"/>
    <path d="M600,150 L1200,150 L1200,300 Z"/>
  </g>

  <!-- Central ambient glow -->
  <circle cx="600" cy="150" r="320" fill="url(#engineGlow)"/>

  <!-- Tech geometric ring accents -->
  <g stroke="#60a5fa" stroke-width="1.5" opacity="0.3" fill="none">
    <circle cx="600" cy="150" r="110"/>
    <circle cx="600" cy="150" r="140"/>
    <line x1="400" y1="150" x2="800" y2="150" stroke-dasharray="8,8"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="294" width="1200" height="6" fill="#38bdf8"/>
</svg>
